{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Red Pandas Donations</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap">
        <link rel="stylesheet" href="{% static 'css/donation.css' %}">
    </head>
    <body>
        <header class="page-header">
            <div class="container">
                <h1><a href="/">Red Pandas Donations</a></h1>
                <a href="{% url 'donation_new' %}" class="top-menu">
                    <button type="submit" class="save btn btn-secondary">Click Here to Donate</button>
                </a>
                {% if user.is_authenticated %}
                    <div class="top-menu-wrapper">
                        <p id="logout" class="top-menu-wrapper" style="display: inline;">Hello {{ user.username }}</p>
                        <form method="post" action="{% url 'logout' %}" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link">Logout</button>
                        </form>
                    </div>
                {% else %}
                    <div class="top-menu-wrapper">
                        <a href="{% url 'login' %}" class="top-menu-wrapper" style="display: inline;">click here to login</a>
                    </div>
                {% endif %}
            </div>
        </header>
        <main class="container">
            <div class="row">
                <div class="col">
                {% block content %}
                {% endblock %}
                </div>
            </div>
        </main>
    </body>
</html>
